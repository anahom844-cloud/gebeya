name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: |
          flutter create --org et.gebeya --project-name gebeya .
          rm -rf test
      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="ገበያ"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: gebeya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
